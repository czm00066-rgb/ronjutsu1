<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f17" />
  <title>設問1トレーニング</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">

    <header class="topbar">
      <div class="dot"></div>
      <div class="toptext">
        <h1>設問1トレーニング</h1>
        <div class="sub">2行想定｜【現状＋出来事】→【葛藤A/B】→【問い】</div>
      </div>
      <div class="topright">
        <div class="pill" id="metaTop">1 / 1</div>
      </div>
    </header>

    <section class="card">
      <div class="card-h">
        <div class="kicker">テーマ</div>
        <div class="right navright">
          <button class="iconbtn" id="prevBtn" type="button" aria-label="prev">◀︎</button>
          <button class="iconbtn" id="nextBtn" type="button" aria-label="next">▶︎</button>
        </div>
      </div>

      <!-- Theme (tap toggles YOUR answer card) -->
      <div id="theme" class="theme" role="button" aria-expanded="true" tabindex="0"></div>
      <div class="hint">テーマをタップすると「あなたの回答」が表示／非表示になります（誤タップ防止）</div>
    </section>

    <section class="card" id="myCard">
      <div class="card-h">
        <div>
          <div class="kicker">あなたの回答（2行想定）</div>
        </div>
        <div class="right">
          <div id="counter" class="counter">0 文字（目標 80）</div>
        </div>
      </div>

      <textarea
        id="myAnswer"
        class="ta"
        placeholder="【現状】＋【出来事】により、&#10;【葛藤A】と【葛藤B】の間で揺れ、今後どのようにすればよいか悩んでいる。&#10;&#10;①万能：～したいとの思い、〜すべきとの思い&#10;②価値対立：〜を優先すべきとの思い&#10;③安定側：〜を維持したい思い、～を続けたい思い&#10;④挑戦側：〜に踏み出すべきとの思い&#10;⑤改善系：〜を見直すべきとの思い"
      ></textarea>

      <div class="below">
        <div class="subhint">※改行は自由。問題ごとに自動保存されます。</div>
        <div class="tools">
          <button id="clearBtn" class="btn" type="button">この回答を消す</button>
          <button id="copyBtn" class="btn" type="button">回答をコピー</button>
          <button id="toggleModelBtn" class="btn" type="button">模範を表示</button>
        </div>
      </div>
    </section>

    <section class="card" id="modelCard">
      <div class="card-h">
        <div class="kicker">模範</div>
      </div>
      <div id="answer" class="model"></div>
    </section>

    <footer class="footnote">※保存・統計なし（ローカル自動保存のみ）</footer>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
