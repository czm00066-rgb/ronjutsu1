<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>設問1トレーニング</title>

  <style>
    :root{
      --border:#e5e5e5;
      --text:#111;
      --muted:#666;
      --bg:#fff;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color:var(--text);
      background:var(--bg);
    }
    .wrap{
      max-width: 860px;
      margin: 0 auto;
      padding: 16px;
    }

    /* ===== Theme ===== */
    .theme{
      font-size: 18px;
      line-height: 1.5;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      user-select: none;
      cursor: pointer;
    }
    .hint{
      font-size: 12px;
      color: var(--muted);
      margin: 10px 2px 0;
    }

    /* ===== Card ===== */
    .card{
      margin-top: 14px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
    }

    /* ===== Model answer ===== */
    #answer{
      margin-top: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      display: none;
      white-space: pre-wrap;
      line-height: 1.8;
    }

    /* ===== Input ===== */
    label{
      display:block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    textarea{
      width:100%;
      min-height: 170px;
      resize: vertical;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 16px;
      line-height: 1.8;
      outline: none;
    }

    .below{
      display:flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .subhint{
      font-size: 12px;
      color: var(--muted);
    }
    .counter{
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 13px;
      white-space: nowrap;
      user-select: none;
    }
    .counter.ok{ font-weight: 700; }
    .counter.warn{ font-weight: 800; }

    /* ===== Tool buttons (inside card) ===== */
    .tools{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .toolbtn{
      padding: 12px 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background:#fff;
      font-size: 14px;
      cursor: pointer;
    }

    /* ===== Bottom nav ===== */
    .nav{
      position: sticky;
      bottom: 0;
      background: #fff;
      padding-top: 12px;
      margin-top: 18px;
    }
    .btnrow{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .navbtn{
      padding: 14px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background:#fff;
      font-size: 16px;
      cursor: pointer;
    }
    .navbtn:disabled{
      opacity: .45;
      cursor: not-allowed;
    }
    .meta{
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }

    /* ===== Small screens ===== */
    @media (max-width: 420px){
      .theme{ font-size: 17px; }
      textarea{ min-height: 160px; }
      .tools{ grid-template-columns: 1fr 1fr 1fr; }
      .toolbtn{ font-size: 13px; padding: 11px 8px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- Theme (tap toggles YOUR answer card in app.js) -->
    <div id="theme" class="theme" role="button" aria-expanded="true" tabindex="0"></div>
    <div class="hint">テーマをタップすると「あなたの回答」が表示／非表示になります（誤タップ防止）</div>

    <!-- Model answer (button toggles this) -->
    <div id="answer"></div>

    <!-- Your answer card -->
    <div id="myCard" class="card">
      <label for="myAnswer">あなたの回答（2行想定）</label>
      <textarea id="myAnswer" placeholder="【現状】＋【出来事】により、&#10;【葛藤A】と【葛藤B】の間で揺れ、今後どのようにすればよいか悩んでいる。"></textarea>

      <div class="below">
        <div class="subhint">※改行は自由。問題ごとに自動保存されます。</div>
        <div id="counter" class="counter">0 文字（目標 80）</div>
      </div>

      <div class="tools">
        <button id="clearBtn" class="toolbtn" type="button">この回答を消す</button>
        <button id="copyBtn" class="toolbtn" type="button">回答をコピー</button>
        <button id="toggleModelBtn" class="toolbtn" type="button">模範を見る</button>
      </div>
    </div>

    <!-- Bottom navigation -->
    <div class="nav">
      <div class="btnrow">
        <button id="prevBtn" class="navbtn" type="button">前の問題</button>
        <button id="nextBtn" class="navbtn" type="button">次の問題</button>
      </div>
      <div id="meta" class="meta"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
