<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>論述トレーニング</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }

    .theme {
      font-size: 18px; line-height: 1.5;
      padding: 16px; border: 1px solid #ddd; border-radius: 12px;
      user-select: none; cursor: pointer;
    }
    .hint { font-size: 12px; opacity: .7; margin-top: 8px; }

    .answer {
      margin-top: 12px; padding: 16px; border: 1px solid #ddd; border-radius: 12px;
      display: none; white-space: pre-wrap; line-height: 1.7;
    }

    .card {
      margin-top: 14px; padding: 16px; border: 1px solid #ddd; border-radius: 12px;
    }
    .row { display: flex; gap: 12px; align-items: flex-end; }
    .col { flex: 1; }

    label { display:block; font-size: 13px; opacity: .8; margin-bottom: 8px; }
    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 16px;
      line-height: 1.7;
      box-sizing: border-box;
      outline: none;
    }

    .counter {
      display: inline-block;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid #ddd;
      font-size: 13px;
      white-space: nowrap;
      user-select: none;
    }
    .counter.ok { font-weight: 600; }
    .counter.warn { font-weight: 700; }
    .subhint { font-size: 12px; opacity: .75; margin-top: 8px; }

    .nav {
      position: sticky; bottom: 0; background: #fff;
      padding: 12px 0 0; margin-top: 20px;
    }
    .btnrow { display: flex; gap: 12px; }
    button {
      flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #ddd;
      font-size: 16px; cursor: pointer; background: #fff;
    }
    .meta { margin-top: 10px; font-size: 12px; opacity: .75; text-align: right; }

    .tools { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    .toolbtn {
      padding: 10px 12px; border-radius: 12px; border: 1px solid #ddd;
      background: #fff; cursor: pointer; font-size: 14px;
	.below{
	　display:flex;
	　gap:12px;
	　align-items:center;
	　justify-content:space-between;
	　margin-top:10px;
　   }
  </style>
</head>
<body>
  <div class="wrap">

    <div id="theme" class="theme" role="button" aria-expanded="false" tabindex="0"></div>
    <div class="hint">テーマをタップすると「模範回答」が表示／非表示になります</div>

    <div id="answer" class="answer"></div>

    <div class="card">
      <div class="row">
        <div class="col">
          <label for="myAnswer">あなたの回答（2行想定）</label>
          <textarea id="myAnswer" placeholder="【現状】＋【出来事】により、&#10;【葛藤A】と【葛藤B】の間で揺れ、今後どのようにすればよいか悩んでいる。"></textarea>
        <div class="below">
			<div class="subhint">※改行は自由。問題ごとに自動保存されます。</div>
            <div id="counter" class="counter">0 文字（目標 80）</div>
        </div>
      </div>

      <div class="tools">
        <button id="clearBtn" class="toolbtn" type="button">この回答を消す</button>
        <button id="copyBtn" class="toolbtn" type="button">回答をコピー</button>
        <button id="toggleBtn" class="toolbtn" type="button">模範表示/非表示</button>
      </div>
    </div>

    <div class="nav">
      <div class="btnrow">
        <button id="prevBtn" type="button">前の問題</button>
        <button id="nextBtn" type="button">次の問題</button>
      </div>
      <div id="meta" class="meta"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
